<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>JS. Класовий синтаксис. Деструктуризація</title>
        <link rel="stylesheet" href="./assets/styles/reset.css" />
        <link rel="stylesheet" href="./assets/styles/styles.css" />
        <script src="./assets/scripts/destruct.js" defer></script>
        <script src="./assets/scripts/post.js" defer></script>
        <script src="./assets/scripts/range.js" defer></script>
    </head>
    <body>
        <div class="destruct">
            <button class="destruct-obj-btn">Отримати дані користувача</button>
        </div>

        <div class="post">
            <button class="post-show-btn">Запостити</button>
            <button class="post-like-btn">Лайк</button>
            <button class="post-dislike-btn">Дізлайк</button>
            <button class="post-edit-btn">Змінити текст поста</button>
        </div>

        <div class="range">
            <button class="range-show-btn">Показати діапазон</button>
            <button class="range-from-btn">Встановити from</button>
            <button class="range-to-btn">Встановити to</button>
            <button class="range-check-btn">Перевірити число</button>
        </div>
    </body>
</html>
